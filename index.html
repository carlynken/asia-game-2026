<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Games 2026 Schedule & Live Stream Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header Section -->
  <header class="glass sticky top-0 z-50 border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl tracking-wider">AG2026</div>
        <div>
          <h1 id="ui-title" class="text-xl font-bold">亞運會賽程與各國直播頻道</h1>
          <p id="ui-subtitle" class="text-xs text-slate-400">Aichi-Nagoya 2026 Live Schedule & Broadcasters</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Language Selector -->
        <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium border border-slate-600 transition">
          <i class="fa-solid fa-language mr-1"></i> <span id="lang-label">English</span>
        </button>

        <!-- Timezone Selector -->
        <select id="tz-select" onchange="renderSchedule()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-sm border border-slate-600 focus:outline-none">
          <option value="local">Local Time (當前時區)</option>
          <option value="UTC+8">Host Time (UTC+8 亞運大會時間)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Controls & Region Broadcaster Switcher -->
  <main class="max-w-7xl mx-auto px-4 mt-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      
      <!-- Country / Region Broadcaster Switcher -->
      <div class="glass p-4 rounded-xl">
        <label id="lbl-region" class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Select Your Country / Region (選擇所在地區)</label>
        <select id="region-select" onchange="renderSchedule()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-semibold text-red-400 focus:outline-none focus:border-red-500">
          <option value="HK">🇭🇰 Hong Kong (香港 - HOY TV / TVB / RTHK)</option>
          <option value="TW">🇹🇼 Taiwan (台灣 - 愛爾達 ELTA / 公視 PTS / 中視)</option>
          <option value="CN">🇨🇳 China Mainland (中國大陸 - 央視 CCTV-5 / 咪咕 Migu)</option>
          <option value="JP">🇯🇵 Japan (日本 - TBS / NHK / TVer)</option>
          <option value="KR">🇰🇷 South Korea (韓國 - KBS / MBC / SBS)</option>
          <option value="SG">🇸🇬 Singapore (新加坡 - Mewatch / Mediacorp)</option>
          <option value="MY">🇲🇾 Malaysia (馬來西亞 - Astro Arena / RTM)</option>
          <option value="INT">🌐 International / Others (其他地區)</option>
        </select>
      </div>

      <!-- Sport Filter -->
      <div class="glass p-4 rounded-xl">
        <label id="lbl-sport" class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Filter by Sport (按體育項目篩選)</label>
        <select id="sport-select" onchange="renderSchedule()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none">
          <option value="ALL">All Sports (所有項目)</option>
          <option value="Badminton">Badminton (羽毛球)</option>
          <option value="Basketball">Basketball (籃球)</option>
          <option value="Swimming">Swimming (游泳)</option>
          <option value="Table Tennis">Table Tennis (乒乓球)</option>
          <option value="eSports">eSports (電子競技)</option>
          <option value="Fencing">Fencing (擊劍)</option>
        </select>
      </div>

      <!-- Search Box -->
      <div class="glass p-4 rounded-xl">
        <label id="lbl-search" class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Search Matches / Players (搜索賽事/選手)</label>
        <input type="text" id="search-input" onkeyup="renderSchedule()" placeholder="Search team, athlete, event..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <!-- Data Refresh Info -->
    <div class="flex justify-between items-center text-xs text-slate-400 mb-4 px-1">
      <div id="data-source-status"><i class="fa-solid fa-sync fa-spin mr-1"></i> Fetching latest schedule...</div>
      <button onclick="fetchScheduleFromWorker()" class="hover:text-white transition"><i class="fa-solid fa-arrows-rotate mr-1"></i> Reload Data</button>
    </div>

    <!-- Event Cards Container -->
    <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script>
    // Configuration & State
    let currentLang = 'zh'; // 'zh' or 'en'
    let eventsData = [];
    
    // Cloudflare Worker API endpoint (Replace with your actual worker URL)
    const WORKER_API_URL = "https://asian-games-schedule-api.ken-17e.workers.dev/api/schedule";

    // Regional Streams Map
    const BROADCASTERS = {
      HK: [
        { name: "HOY TV (77台)", url: "https://hoy.tv/", live: true },
        { name: "TVB Sports", url: "https://news.tvb.com/tc/sports", live: true },
        { name: "RTHK 香港電台", url: "https://www.rthk.hk/", live: true }
      ],
      TW: [
        { name: "ELTA Sports 愛爾達體育台", url: "https://eltaott.tv/", live: true },
        { name: "PTS 公視體育", url: "https://www.pts.org.tw/", live: true }
      ],
      CN: [
        { name: "CCTV-5 體育頻道", url: "https://tv.cctv.com/live/cctv5/", live: true },
        { name: "Migu Video 咪咕視頻", url: "https://www.miguvideo.com/", live: true }
      ],
      JP: [
        { name: "TBS Asian Games Special", url: "https://www.tbs.co.jp/", live: true },
        { name: "TVer (Free Stream)", url: "https://tver.jp/", live: true }
      ],
      KR: [
        { name: "KBS Sports", url: "https://sports.kbs.co.kr/", live: true },
        { name: "MBC Sports", url: "https://imnews.imbc.com/sports/", live: true }
      ],
      SG: [
        { name: "mewatch Asian Games Hub", url: "https://www.mewatch.sg/", live: true }
      ],
      MY: [
        { name: "Astro Arena", url: "https://www.astro.com.my/", live: true },
        { name: "RTM Klik", url: "https://rtmklik.rtm.gov.my/", live: true }
      ],
      INT: [
        { name: "Official OCA YouTube Channel", url: "https://www.youtube.com/@OlympicCouncilofAsia", live: true }
      ]
    };

    // Static Fallback Data
    const FALLBACK_EVENTS = [
      {
        id: "fb-1",
        time_utc8: "2026-09-21T09:00:00+08:00",
        sport_en: "Badminton",
        sport_zh: "羽毛球",
        event_en: "Men's Singles Preliminaries",
        event_zh: "男子單打預賽",
        participants_en: "Hong Kong vs Japan",
        participants_zh: "中國香港 vs 日本",
        venue_en: "Ichinomiya Municipal Gymnasium",
        venue_zh: "一宮市綜合體育館",
        is_medal: false,
        is_live: true
      },
      {
        id: "fb-2",
        time_utc8: "2026-09-21T18:00:00+08:00",
        sport_en: "eSports",
        sport_zh: "電子競技",
        event_en: "League of Legends Group Stage",
        event_zh: "英雄聯盟 小組賽",
        participants_en: "Chinese Taipei vs South Korea",
        participants_zh: "中華台北 vs 韓國",
        venue_en: "Aichi Sky Expo",
        venue_zh: "愛知國際展覽中心",
        is_medal: true,
        is_live: false
      },
      {
        id: "fb-3",
        time_utc8: "2026-09-22T14:30:00+08:00",
        sport_en: "Table Tennis",
        sport_zh: "乒乓球",
        event_en: "Women's Team Finals",
        event_zh: "女子團體決賽",
        participants_en: "China vs Japan",
        participants_zh: "中國 vs 日本",
        venue_en: "Nagoya City General Gymnasium",
        venue_zh: "名古屋市綜合體育館",
        is_medal: true,
        is_live: false
      }
    ];

    async function fetchScheduleFromWorker() {
      const statusEl = document.getElementById('data-source-status');
      statusEl.innerHTML = `<i class="fa-solid fa-sync fa-spin mr-1"></i> Connecting to Worker API...`;
      
      try {
        const res = await fetch(WORKER_API_URL);
        if (!res.ok) throw new Error("Worker unreachable");
        const data = await res.json();
        
        if (data.events && data.events.length > 0) {
          eventsData = data.events;
          statusEl.innerHTML = `<i class="fa-solid fa-check text-green-400 mr-1"></i> Live feed via ${data.source || 'Asia Sports Hub'}`;
        } else {
          throw new Error("Empty feed response");
        }
      } catch (e) {
        console.warn("Worker fetch failed, using fallback schedule data.", e);
        eventsData = FALLBACK_EVENTS;
        statusEl.innerHTML = `<i class="fa-solid fa-database text-yellow-400 mr-1"></i> Offline Mode (Standard Schedule Dataset)`;
      }
      
      renderSchedule();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('lang-label').innerText = currentLang === 'zh' ? 'English' : '繁體中文';
      
      // Update Static Labels
      document.getElementById('ui-title').innerText = currentLang === 'zh' ? '亞運會賽程與各國直播頻道' : 'Asian Games Schedule & Live Directory';
      document.getElementById('lbl-region').innerText = currentLang === 'zh' ? '選擇所在地區 (Select Region)' : 'Select Your Region / Country';
      document.getElementById('lbl-sport').innerText = currentLang === 'zh' ? '按體育項目篩選 (Filter Sport)' : 'Filter by Sport';
      document.getElementById('lbl-search').innerText = currentLang === 'zh' ? '搜尋賽事 / 選手 (Search)' : 'Search Matches / Athletes';
      
      renderSchedule();
    }

    function renderSchedule() {
      const container = document.getElementById('events-grid');
      const selectedRegion = document.getElementById('region-select').value;
      const selectedSport = document.getElementById('sport-select').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const tzMode = document.getElementById('tz-select').value;

      container.innerHTML = "";

      const filteredEvents = eventsData.filter(ev => {
        const matchesSport = selectedSport === "ALL" || ev.sport_en === selectedSport;
        const nameToSearch = `${ev.sport_en} ${ev.sport_zh} ${ev.event_en} ${ev.event_zh} ${ev.participants_en} ${ev.participants_zh}`.toLowerCase();
        const matchesSearch = nameToSearch.includes(searchQuery);
        return matchesSport && matchesSearch;
      });

      if (filteredEvents.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 glass rounded-2xl">
            <i class="fa-solid fa-calendar-xmark text-4xl text-slate-500 mb-3"></i>
            <p class="text-slate-400">${currentLang === 'zh' ? '沒有找到符合條件的賽事記錄' : 'No schedule matches found.'}</p>
          </div>`;
        return;
      }

      const regionStreams = BROADCASTERS[selectedRegion] || BROADCASTERS.INT;

      filteredEvents.forEach(ev => {
        const eventTime = new Date(ev.time_utc8);
        const formattedTime = tzMode === 'local' 
          ? eventTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) + " (Local)"
          : eventTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' }) + " (UTC+8)";

        const formattedDate = eventTime.toLocaleDateString([], { month: 'short', day: 'numeric', weekday: 'short' });

        const card = document.createElement('div');
        card.className = "glass rounded-xl p-5 flex flex-col justify-between hover:border-slate-500 transition shadow-lg relative overflow-hidden";

        card.innerHTML = `
          ${ev.is_medal ? `<div class="absolute top-0 right-0 bg-amber-500 text-black text-[10px] font-extrabold px-3 py-0.5 rounded-bl-lg uppercase tracking-wider"><i class="fa-solid fa-medal mr-1"></i>Medal Event</div>` : ''}
          
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-800 text-red-400 border border-slate-700">
                ${currentLang === 'zh' ? ev.sport_zh : ev.sport_en}
              </span>
              <span class="text-xs text-slate-400 font-mono">
                <i class="fa-regular fa-clock mr-1"></i>${formattedDate} ${formattedTime}
              </span>
            </div>

            <h3 class="text-lg font-bold mb-1 text-slate-100">
              ${currentLang === 'zh' ? ev.event_zh : ev.event_en}
            </h3>

            <p class="text-sm font-medium text-slate-300 mb-3 flex items-center gap-1">
              <i class="fa-solid fa-users text-xs text-slate-500"></i>
              ${currentLang === 'zh' ? ev.participants_zh : ev.participants_en}
            </p>

            <p class="text-xs text-slate-400 mb-4">
              <i class="fa-solid fa-location-dot mr-1"></i>${currentLang === 'zh' ? ev.venue_zh : ev.venue_en}
            </p>
          </div>

          <!-- Broadcasters Section -->
          <div class="pt-3 border-t border-slate-700/60">
            <div class="text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider flex items-center justify-between">
              <span>${currentLang === 'zh' ? '可用直播頻道' : 'Live Broadcasters'}</span>
              <span class="text-red-400 font-mono text-[10px]">${selectedRegion}</span>
            </div>
            
            <div class="flex flex-wrap gap-2">
              ${regionStreams.map(stream => `
                <a href="${stream.url}" target="_blank" rel="noopener noreferrer" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-red-600/20 hover:text-red-300 text-slate-200 border border-slate-700 hover:border-red-500/50 transition flex items-center gap-1.5">
                  <i class="fa-solid fa-circle-play text-red-500 text-[10px]"></i>
                  ${stream.name}
                </a>
              `).join('')}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Initialize Application
    document.addEventListener('DOMContentLoaded', fetchScheduleFromWorker);
  </script>
</body>
</html>
